<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Bongo's Pizzeria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: full-bleed 3D kitchen; cream "order ticket" panels pinned to the corners; an action prompt along the bottom.
     In a close-up (the steel station or the oven) the side panels step back and that view's panel takes the top. */
  :root {
    --tomato:#e2482f; --basil:#3f8f4f; --crust:#f2c27b; --ticket:#fff6e6; --ink:#2a1e17; --muted:#7b6a5c; --line:rgba(42,30,23,.14);
    --display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body:"Nunito", ui-rounded, system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height:100%; margin:0; overflow:hidden; background:#9cc5c0; color:var(--ink); font:600 13px/1.35 var(--body); }
  canvas#view { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none; }
  canvas#view.pixel { image-rendering:pixelated; image-rendering:crisp-edges; }
  .panel { position:fixed; background:var(--ticket); border:2px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); }
  /* one narrow bar across the top: what's waiting, the three oven spots, what's gone out and the day's profit */
  .ticket { top:calc(8px + env(safe-area-inset-top, 0px)); left:max(12px, env(safe-area-inset-left, 0px)); right:max(12px, env(safe-area-inset-right, 0px));
    margin:0 auto; width:fit-content; max-width:calc(100vw - 24px); box-sizing:border-box; padding:5px 12px; display:flex; align-items:center; gap:14px;
    border-radius:10px; box-shadow:0 3px 0 var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
  h1 { margin:0; font:400 17px/1 var(--display); letter-spacing:.3px; color:var(--tomato); }
  .stat { display:flex; align-items:baseline; gap:5px; }
  .stat span { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .stat b { font:400 16px/1 var(--display); color:var(--ink); }
  .stat b.neg { color:var(--tomato); }
  #next { color:var(--muted); font-weight:800; font-size:12px; max-width:250px; overflow:hidden; text-overflow:ellipsis; }
  #next .re { color:var(--tomato); }
  .sep { width:2px; align-self:stretch; background:var(--line); }
  #ovenBar { display:flex; gap:4px; }
  .oslot { position:relative; width:58px; height:24px; box-sizing:border-box; border:2px solid var(--ink); border-radius:6px; background:#fff; overflow:hidden;
    font:800 10px/20px var(--body); text-align:center; color:var(--ink); }
  .oslot i { position:absolute; left:0; top:0; bottom:0; background:var(--crust); }
  .oslot em { position:relative; font-style:normal; }
  .oslot.empty { border-style:dashed; border-color:rgba(42,30,23,.35); background:transparent; color:var(--muted); }
  .oslot.ready i { background:#8fd49a; } .oslot.over i { background:#e0a050; } .oslot.burning i { background:#e2482f; } .oslot.burning { color:#fff; }
  .oslot.burnt { background:#2e2018; color:#fff; } .oslot.burnt i { display:none; }
  .row { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
  .row label { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); width:46px; }
  button { font:800 12px/1 var(--body); color:var(--ink); background:#fff; border:2px solid var(--ink); border-radius:8px; padding:6px 9px; cursor:pointer; }
  button:hover { background:var(--crust); }
  button:focus-visible { outline:3px solid var(--basil); outline-offset:2px; }
  button.on { background:var(--tomato); color:#fff; }
  button:disabled { opacity:.55; cursor:default; background:#fff; }
  kbd { font:800 10px/1 var(--body); color:var(--muted); border:1.5px solid var(--line); border-radius:4px; padding:2px 4px; margin-right:6px; background:#fff; }
  button.on kbd, .go kbd { color:#fff; border-color:rgba(255,255,255,.5); background:transparent; }

  .bottom { left:max(16px, env(safe-area-inset-left, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(82px + env(safe-area-inset-bottom, 0px));
    margin:0 auto; width:fit-content; max-width:calc(100vw - 32px); padding:8px 10px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bottom .row { justify-content:center; gap:6px; }
  #act, #act2 { font-size:14px; padding:9px 14px; }
  #act.go { background:var(--basil); color:#fff; }
  #act2[hidden], #act[hidden], #bottom[hidden], #phone[hidden] { display:none; }
  #slots { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:6px; z-index:6; }
  .slot { width:56px; height:56px; padding:5px; background:var(--ticket); border:2px solid var(--ink); border-radius:10px; box-shadow:0 3px 0 var(--ink); display:grid; place-items:center; }
  .slot svg { width:100%; height:100%; display:block; }
  .slot.sel { background:var(--basil); transform:translateY(-3px); }
  .slot.empty { background:rgba(255,246,230,.28); border-style:dashed; box-shadow:none; cursor:default; }
  #phone { right:max(16px, env(safe-area-inset-right, 0px)); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); width:196px; padding:12px 12px 16px; background:#1c1f24; border-radius:20px; color:#fff; text-transform:uppercase; }
  #phone b { display:block; font:400 20px/1.1 var(--display); color:#a6d13c; }
  #phone small { display:block; margin-top:2px; font:800 11px/1.2 var(--body); color:#fff; }
  #phone ul { list-style:none; margin:9px 0; padding:0; display:grid; gap:5px; font:800 10px/1 var(--body); letter-spacing:.5px; }
  #phone li { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #phone li i { display:inline-block; width:12px; height:8px; margin-left:2px; border-radius:2px; background:#3a3f47; }
  #phone li i.on { background:#a6d13c; } #phone li.bad i.on { background:#e2482f; }
  #phone p { margin:0; font:800 11px/1.25 var(--body); color:#ffd23f; }
  #alert { position:fixed; left:50%; top:calc(66px + env(safe-area-inset-top, 0px)); transform:translateX(-50%); z-index:8; display:none; padding:12px 26px; background:#d3170f; color:#fff; text-align:center; white-space:nowrap;
    font:400 36px/1.05 var(--display); letter-spacing:1px; border:4px solid #fff; outline:4px solid #000; border-radius:14px; pointer-events:none; animation:alertShake .3s linear infinite, alertFlash .5s steps(1) infinite; }
  #alert small { display:block; margin-top:4px; font:800 14px/1.2 var(--body); letter-spacing:.5px; }
  #alertEdge { position:fixed; inset:0; z-index:4; display:none; pointer-events:none; box-shadow:inset 0 0 130px 46px rgba(225,0,0,.8); animation:alertPulse .5s ease-in-out infinite alternate; }
  body.alert #alert, body.alert #alertEdge { display:block; }
  @keyframes alertShake { 0%,100% { transform:translateX(-50%) rotate(-1.4deg); } 25% { transform:translateX(calc(-50% + 5px)) rotate(1.2deg); } 50% { transform:translateX(calc(-50% - 4px)) rotate(-.8deg); } 75% { transform:translateX(calc(-50% + 3px)) rotate(1.4deg); } }
  @keyframes alertFlash { 0% { background:#d3170f; } 50% { background:#ff2a1f; } }
  @keyframes alertPulse { from { opacity:.35; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #alert { animation:none; } #alertEdge { animation:none; opacity:.7; } }
  #stick, #turn { display:none; }
  body.touch { touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  body.touch #stick { display:block; position:fixed; left:max(24px, env(safe-area-inset-left, 0px)); bottom:calc(22px + env(safe-area-inset-bottom, 0px)); width:132px; height:132px; z-index:6; border-radius:50%; background:rgba(255,246,230,.16); border:3px solid rgba(255,246,230,.75); box-sizing:border-box; touch-action:none; }
  #stick i { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px; border-radius:50%; background:rgba(255,246,230,.88); border:2px solid var(--ink); box-sizing:border-box; }
  body.touch.fp #stick, body.touch.oven #stick, body.touch.boxfp #stick { display:none; }
  body.touch kbd { display:none; }
  body.touch .bottom { left:auto; right:max(20px, env(safe-area-inset-right, 0px)); bottom:calc(26px + env(safe-area-inset-bottom, 0px)); max-width:230px; }
  body.touch .bottom .row { flex-direction:column; align-items:stretch; gap:8px; }
  body.touch #act, body.touch #act2 { font-size:17px; line-height:1.15; padding:15px 18px; }
  @media (max-height:480px) {
    body.touch #slots { gap:4px; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); }
    body.touch .slot { width:42px; height:42px; padding:3px; border-radius:8px; }
    body.touch #alert { top:calc(50px + env(safe-area-inset-top, 0px)); font-size:24px; padding:7px 16px; }
    body.touch #phone { bottom:calc(60px + env(safe-area-inset-bottom, 0px)); width:170px; padding:9px; }
  }
  @media (orientation:portrait) and (max-width:600px) {
    body.touch #turn { position:fixed; inset:0; z-index:30; display:grid; place-content:center; justify-items:center; gap:16px; background:var(--tomato); color:#fff; font:400 26px/1.1 var(--display); text-align:center; padding:24px; }
  }
  #turn svg { width:96px; height:96px; }
  body.fp #slots, body.oven #slots, body.boxfp #slots, body.fp #phone, body.oven #phone, body.boxfp #phone { display:none; }

  .close { display:none; top:calc(12px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); width:min(380px, calc(100vw - 32px)); padding:10px 12px; }
  .close h2 { margin:0; font:400 20px/1 var(--display); color:var(--tomato); display:flex; justify-content:space-between; gap:8px; }
  .close h2 small { font:800 11px/1.6 var(--body); color:var(--muted); }
  #fpList { list-style:none; margin:6px 0; padding:6px 0; display:flex; flex-wrap:wrap; gap:4px 10px; border-top:2px dashed var(--line); border-bottom:2px dashed var(--line); }
  #fpList li { font-weight:800; color:var(--muted); }
  #fpList li::before { content:"○ "; }
  #fpList li.got { color:var(--basil); } #fpList li.got::before { content:"✓ "; }
  #fpList li.extra { color:var(--tomato); } #fpList li.extra::before { content:"✗ "; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  #fpDone.go { background:var(--basil); color:#fff; }
  @keyframes shake { 0%,100% { transform:translateX(-50%); } 20% { transform:translateX(calc(-50% - 9px)); } 40% { transform:translateX(calc(-50% + 8px)); }
    60% { transform:translateX(calc(-50% - 6px)); } 80% { transform:translateX(calc(-50% + 4px)); } }
  #fp.shake { animation:shake .38s; border-color:var(--tomato); }
  #ovenMsg { margin:6px 0; font-weight:800; }
  #boxMsg { margin:6px 0; font-weight:800; }
  body.fp #fp, body.oven #ovenView, body.boxfp #boxView { display:block; }
  body.fp .ticket, body.oven .ticket, body.boxfp .ticket { top:auto; bottom:calc(8px + env(safe-area-inset-bottom, 0px)); }   /* the work panel takes the top, the bar drops to the bottom */
  body.fp .bottom, body.oven .bottom, body.boxfp .bottom { display:none; }
  body.dragging, body.dragging canvas { cursor:grabbing !important; }

  /* the three status labels that hang over the pizzas inside the oven */
  .otag { position:fixed; left:0; top:0; transform:translate(-50%, -100%); display:none; min-width:84px; padding:5px 7px; text-align:center;
    background:var(--ticket); border:2px solid var(--ink); border-radius:8px; box-shadow:0 3px 0 var(--ink); font:800 12px/1.2 var(--body); }
  body.oven .otag { display:block; }
  .otag .bar { display:block; height:8px; margin:4px 0 3px; border:1.5px solid var(--ink); border-radius:4px; overflow:hidden; background:#fff; }
  .otag .bar i { display:block; height:100%; background:var(--crust); }
  .otag.ready { background:#dff3df; } .otag.ready .bar i { background:var(--basil); }
  .otag.burnt { background:#3d2a1e; color:#fff; } .otag.burnt .bar i { background:#000; }
  .otag.empty { color:var(--muted); opacity:.42; }   /* an empty spot is only a faint label; a pizza makes it solid */
  .otag.empty.sel { opacity:.72; }
  .otag.sel { outline:3px solid var(--tomato); outline-offset:2px; }

  #toast { position:fixed; left:50%; top:30%; transform:translate(-50%, -50%) scale(.9); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    font:400 24px/1.1 var(--display); color:#fff; text-align:center; padding:10px 16px; border:2px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); background:var(--basil); max-width:calc(100vw - 32px); z-index:5; }
  #toast.show { opacity:1; transform:translate(-50%, -50%) scale(1); }
  #toast.bad { background:var(--tomato); }
  #toast small { display:block; font:800 13px/1.3 var(--body); }
  body.fp #toast, body.oven #toast, body.boxfp #toast { top:auto; bottom:calc(10% + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 0) scale(.9); }
  body.fp #toast.show, body.oven #toast.show, body.boxfp #toast.show { transform:translate(-50%, 0) scale(1); }

  @media (max-width:640px) {
    .ticket { gap:8px; padding:4px 8px; }
    h1, #next, .sep { display:none; }
    .stat span { font-size:9px; letter-spacing:.4px; }
    .oslot { width:44px; }
    .row label { display:none; }
    button { padding:6px 7px; }
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition:none; } }
  /* first-person aim dot: a soft dot with a dark rim so it shows on light and dark surfaces */
  #aim { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; pointer-events:none; z-index:5;
    background:rgba(255,255,255,.55); box-shadow:0 0 0 1.5px rgba(0,0,0,.35); display:none; }
</style>

<canvas id="view"></canvas>
<div id="aim" aria-hidden="true"></div>

<section class="panel ticket" aria-label="Kitchen status">
  <h1>Bongo's Pizzeria</h1>
  <div class="stat"><span>To make</span><b id="toMake">0</b></div>
  <div id="next"></div>
  <div class="sep"></div>
  <div class="stat"><span>Oven</span><div id="ovenBar"></div></div>
  <div class="sep"></div>
  <div class="stat"><span>Sent</span><b id="sent">0</b></div>
  <div class="stat"><span>Profit</span><b id="takings">£0.00</b></div>
</section>

<div class="panel bottom" id="bottom">
  <div class="row"><button id="act" disabled></button><button id="act2" hidden></button></div>
</div>

<div id="stick" aria-hidden="true"><i></i></div>
<div id="turn"><svg viewBox="0 0 96 96" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="30" y="10" width="36" height="62" rx="7"/><path d="M14 82c14 8 44 8 62-8M68 66l9 7-3 11"/></svg>TURN YOUR PHONE SIDEWAYS</div>
<div id="alertEdge" aria-hidden="true"></div>
<div id="alert" role="alert">INSPECTOR COMING!<small id="alertCount"></small></div>
<div id="slots" aria-label="Items"></div>
<section class="panel" id="phone" aria-label="Phone" hidden><b id="phRate"></b><small id="phWord"></small><ul id="phZones"></ul><p id="phMsg"></p></section>

<section class="panel close" id="fp" aria-label="Order being made">
  <h2><span id="fpTitle">#101 · Margherita</span><small id="fpMore"></small></h2>
  <ul id="fpList"></ul>
  <div class="btns">
    <button id="fpDone"><kbd>Enter</kbd>Pick it up</button>
    <button id="fpRedo"><kbd>⌫</kbd>Start again</button>
    <button id="fpBack"><kbd>Esc</kbd>Step back</button>
  </div>
</section>

<section class="panel close" id="ovenView" aria-label="Oven">
  <h2><span>The oven</span><small id="ovenCount"></small></h2>
  <div id="ovenMsg"></div>
  <div class="btns"><button id="ovenBack"><kbd>Esc</kbd>Step back</button></div>
</section>
<section class="panel close" id="boxView" aria-label="Boxing">
  <h2><span id="boxTitle">Box it</span></h2>
  <div id="boxMsg"></div>
  <div class="btns"><button id="boxBack"><kbd>Esc</kbd>Step back</button></div>
</section>
<button class="otag" data-slot="0"></button><button class="otag" data-slot="1"></button><button class="otag" data-slot="2"></button>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===================================================================== renderer & scene
const TOUCH = /[?&]touch=1/.test(location.search) || matchMedia("(pointer: coarse)").matches, LOW = TOUCH;   // phones get on-screen controls and lighter graphics
document.body.classList.toggle("touch", TOUCH);
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const BG = new THREE.Color(0x141c33);                     // night outside
scene.background = BG; scene.fog = new THREE.Fog(BG, 20, 44);
const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 120);
camera.position.set(4.08, 8.03, 10.95);
const controls = new THREE.OrbitControls(camera, canvas);
const SHOP_TARGET = new THREE.Vector3(-0.2, 0.6, -1.2);
controls.target.copy(SHOP_TARGET); controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 24; controls.maxPolarAngle = Math.PI * 0.46;

const hemi = new THREE.HemisphereLight(0xfff1dc, 0x5d6870, 0.46); scene.add(hemi);
const shopLit = [];                       // everything the staff door's switch controls: each entry takes the lit level, 0 to 1
const sun = new THREE.DirectionalLight(0xc9d6ff, 0.5);   // moonlight
sun.position.set(-6, 12, 8); sun.castShadow = true; sun.shadow.mapSize.set(LOW ? 1024 : 2048, LOW ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left:-12, right:12, top:10, bottom:-10, near:1, far:40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.006; scene.add(sun);   // just enough bias to stop speckle, small enough that shadows stay attached

// three-step toon ramp gives the flat, printed look
const ramp = new THREE.DataTexture(new Uint8Array([92, 168, 255]), 3, 1, THREE.LuminanceFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (c, extra={}) => new THREE.MeshToonMaterial(Object.assign({ color:c, gradientMap:ramp }, extra));
const INK = new THREE.MeshBasicMaterial({ color:0x2a1e17, side:THREE.BackSide });
// the black cartoon outlines are inverted hulls drawn with these materials; they're off by default (O turns them back on)
const OUTLINE_MATS = [INK]; let outlinesOn = false;
function setOutlines(on) { outlinesOn = on; for (const m of OUTLINE_MATS) m.visible = on; }
function mesh(geo, mat, x=0, y=0, z=0, parent=scene, outline=0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m);
  if (outline) { const o = new THREE.Mesh(geo, INK); o.scale.setScalar(1 + outline); m.add(o); }   // inverted-hull outline
  return m;
}
const redraws = [];
function canvasTex(w, h, draw, nearest=false) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c);
  const redraw = () => { draw(c.getContext("2d"), w, h); t.needsUpdate = true; };
  redraw(); redraws.push(redraw); t.redraw = redraw;
  if (nearest) { t.magFilter = THREE.NearestFilter; }
  t.anisotropy = 4; return t;
}
const ease = (rate, dt) => 1 - Math.exp(-rate * dt);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const JUMP_T = 0.72, JUMP_AIR = 0.8; let jumpQueued = false;      // see jump()
const rnd = (a, b) => a + Math.random() * (b - a);
const money = v => "£" + v.toFixed(2);

// ===================================================================== menu, toppings, order state
const TOPS = [
  { key:"sauce",     name:"Sauce", color:0xd23a2a },
  { key:"cheese",    name:"Mozzarella",   color:0xf6e07a },
  { key:"pepperoni", name:"Pepperoni",    color:0x9a2a24 },
  { key:"mushroom",  name:"Mushroom",     color:0xe8d9c0 },
  { key:"pepper",    name:"Peppers", color:0x4f9a4a },
  { key:"olive",     name:"Olives",       color:0x2f2a2a },
  { key:"ham",       name:"Ham",          color:0xf0a0a0 },
  { key:"pineapple", name:"Pineapple",    color:0xf4d24a },
];
const TOP = Object.fromEntries(TOPS.map(t => [t.key, t]));
const MENU = [
  { name:"Margherita",     t:[],                              price:8.50,  w:3 },
  { name:"Pepperoni",      t:["pepperoni"],                   price:9.95,  w:3 },
  { name:"Funghi",         t:["mushroom"],                    price:9.25,  w:2 },
  { name:"Hawaiian",       t:["ham", "pineapple"],            price:9.50,  w:2 },
  { name:"Meat Feast",     t:["pepperoni", "ham"],            price:11.50, w:2 },
  { name:"Veggie Supreme", t:["mushroom", "pepper", "olive"], price:10.25, w:2 },
];
let queue = [], nextNo = 101, orderIn = 0, sent = 0, takings = 0;
// what goes into a pizza, so a binned one costs you
const COST = { dough:0.45, sauce:0.20, cheese:0.55, pepperoni:0.65, mushroom:0.35, pepper:0.30, olive:0.40, ham:0.65, pineapple:0.40 };
const costOf = p => COST.dough + [...p.userData.tops].reduce((a, k) => a + (COST[k] || 0), 0);
const SCREEN = { flash:0 };

// ===================================================================== surface textures
